services:
  app:
    image: 'mauriceboe/trek:3.0.8'
    container_name: trek
    read_only: true
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    tmpfs:
      - '/tmp:noexec,nosuid,size=64m'
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - PORT=3000
      - 'ENCRYPTION_KEY=${ENCRYPTION_KEY:-}'
      - 'TZ=${TZ:-UTC}'
      - 'LOG_LEVEL=${LOG_LEVEL:-info}'
      - 'ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}'
    volumes:
      - './data:/app/data'
      - './uploads:/app/uploads'
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - wget
        - '-qO-'
        - 'http://localhost:3000/api/health'
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
        - traefik.http.middlewares.authentik-auth@file
        - "coolify.traefik.middleware=authentik-auth@file,trek-security-headers@file"
